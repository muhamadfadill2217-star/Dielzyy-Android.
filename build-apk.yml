name: Build Dielzyy APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q source.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/dielzyy/Metrolist-main" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dielzyy-Android-4.3.0-debug
          path: ${{ env.PROJECT_DIR }}/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
